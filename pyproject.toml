[project]
name = "automacao-diaria"
version = "2.0.0"
description = "Sistema de automação para gestão de escolas públicas"
requires-python = ">=3.9"

dependencies = [
    "flask>=3.0.0",
]

[project.scripts]
app = "app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]